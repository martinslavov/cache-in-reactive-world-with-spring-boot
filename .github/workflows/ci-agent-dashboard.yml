name: Agent Workflow Dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: agent-dashboard-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update-dashboard:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Update dashboard issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_DASHBOARD_ISSUE: ${{ vars.AGENT_DASHBOARD_ISSUE }}
        run: python3 .github/scripts/agent_dashboard.py
