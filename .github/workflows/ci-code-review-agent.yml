# Code review agent: reviews the diff of every pull request with GitHub Models (no extra secrets,
# it uses the workflow GITHUB_TOKEN) and posts one comment, which is updated on every push.
# The review rules live in .github/code-review-guidelines.md.
name: CI Code Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  models: read

concurrency:
  group: ci-code-review-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MODEL: openai/gpt-4.1
      MAX_DIFF_CHARS: "60000"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get pull request diff
        run: |
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" > pr.diff
          if [ "$(wc -c < pr.diff)" -gt "$MAX_DIFF_CHARS" ]; then
            head -c "$MAX_DIFF_CHARS" pr.diff > pr.trimmed
            printf '\n\n[diff truncated]\n' >> pr.trimmed
            mv pr.trimmed pr.diff
            echo "TRUNCATED=true" >> "$GITHUB_ENV"
          fi

      - name: Review with GitHub Models
        run: |
          jq -n \
            --arg model "$MODEL" \
            --rawfile guidelines .github/code-review-guidelines.md \
            --rawfile diff pr.diff \
            --arg title "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title)" \
            '{model: $model, temperature: 0.2, messages: [
               {role: "system", content: ("You are a code review agent. Review the pull request diff strictly following these guidelines. Report only real findings, each in the format Issue / Suggestion / Why, and mention good practices briefly. If nothing needs attention, say so. Reply in English, in Markdown.\n\n" + $guidelines)},
               {role: "user", content: ("Pull request: " + $title + "\n\nDiff:\n\n" + $diff)}]}' > request.json

          curl -sS https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -D headers.txt -o response.json -d @request.json || { cat headers.txt response.json; exit 1; }

          jq -r '.choices[0].message.content' response.json > review.md || { cat headers.txt response.json; exit 1; }

          test -s review.md

      - name: Post review comment
        run: |
          marker="<!-- code-review-agent -->"
          {
            echo "$marker"
            echo "## Code review agent"
            echo
            cat review.md
            if [ "${TRUNCATED:-false}" = "true" ]; then
              echo
              echo "_The diff was larger than ${MAX_DIFF_CHARS} characters, only the first part was reviewed._"
            fi
          } > comment.md

          old=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id")
          if [ -n "$old" ]; then
            for id in $old; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${id}"
            done
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
