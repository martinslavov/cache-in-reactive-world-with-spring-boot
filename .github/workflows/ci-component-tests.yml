# Starts the whole stack with docker compose (PostgreSQL, Redis and the RCAS image) and runs the
# component tests against it.
#
# Uses the optional repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (read-only pull token):
# the Dockerfile uses Docker Hardened Images (dhi.io). The login is skipped when the secrets are not
# available (fork PRs); the tests still run.
name: CI Component Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-component-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-tests:
    name: Component Tests (make up && make component-tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install/Update docker compose cli
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: latest

      # Fork PRs and Dependabot runs get no secrets: skip the login instead of failing. The tests still run.
      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          HAS_CREDENTIALS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: echo "available=$HAS_CREDENTIALS" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hardened Images registry
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build application jar
        run: make build

      - name: Execute infrastructure up command
        run: make up

      - name: Execute component tests command
        run: make component-tests

      - name: Collect infrastructure logs
        if: always()
        run: make logs > infra-logs.txt 2>&1 || true

      - name: Execute infrastructure down command
        if: always()
        run: make down

      - name: Upload component test reports and infrastructure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: component-tests-reports
          path: |
            component-tests/build/reports/tests/componentTest/
            component-tests/build/test-results/componentTest/
            infra-logs.txt
          if-no-files-found: ignore
