# Blocks pull requests that introduce dependencies with known high or critical vulnerabilities.
# Runs on every pull request (no path filters) so the required check is always reported.
name: CI Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
