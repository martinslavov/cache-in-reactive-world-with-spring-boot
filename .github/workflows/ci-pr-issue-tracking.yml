name: PR Issue Tracking

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

# Serialize runs for the same PR to avoid creating duplicate tracking issues
concurrency:
  group: pr-issue-tracking-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  create-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Create or find linked issue
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            const marker =
              `<!-- pr-tracking:${owner}/${repo}#${pr.number} -->`;

            // Search all repository issues, including closed issues.
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: 'all',
                per_page: 100
              }
            );

            let issue = issues.find(item =>
              !item.pull_request &&
              item.body?.includes(marker)
            );

            if (!issue) {
              const result = await github.rest.issues.create({
                owner,
                repo,
                title: `Track PR #${pr.number}: ${pr.title}`,
                body: [
                  marker,
                  '## Pull Request tracking',
                  '',
                  `**Pull Request:** [#${pr.number}](${pr.html_url})`,
                  `**Author:** @${pr.user.login}`,
                  '',
                  '### Description',
                  pr.body || 'No description provided.',
                  '',
                  '### Checklist',
                  '- [ ] Build passed',
                  '- [ ] Tests passed',
                  '- [ ] Security checks passed',
                  '- [ ] Code review completed',
                  '- [ ] Pull Request merged'
                ].join('\n')
              });

              issue = result.data;
            }

            // Link the issue back to the PR.
            const commentMarker =
              `<!-- pr-tracking-link:${owner}/${repo}#${pr.number} -->`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: pr.number,
                per_page: 100
              }
            );

            const linked = comments.some(comment =>
              comment.body?.includes(commentMarker)
            );

            if (!linked) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: [
                  commentMarker,
                  `Tracking issue: [#${issue.number}](${issue.html_url})`
                ].join('\n')
              });
            }

            core.info(`Tracking issue: #${issue.number}`);
