# Runs the tests and publishes a GitHub release with the executable jar.
# Release notes are generated from the merged pull requests and commits.
# Called by ci-tag.yml after merges into main; a manually pushed tag also triggers it,
# for example: git tag v1.0.0 && git push origin v1.0.0. An existing release is left unchanged.
# Each successful release keeps only the two newest stable vX.Y.Z releases and tags.
name: CI Release

on:
  push:
    tags:
      - "v**"
  workflow_call:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string

permissions: {}

env:
  KEEP_RELEASES: "2"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build and test
        run: ./gradlew build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" build/libs/*.jar -R "$REPO" --title "$TAG" --generate-notes --verify-tag

  prune:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Delete old releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          old=$(gh api "repos/$REPO/git/matching-refs/tags/v" --paginate --jq '.[].ref | sub("^refs/tags/"; "")' \
            | python3 .github/scripts/release_tag.py prune --keep "$KEEP_RELEASES")
          for tag in $old; do
            if gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
              gh release delete "$tag" -R "$REPO" --yes --cleanup-tag
            else
              gh api -X DELETE "repos/$REPO/git/refs/tags/$tag"
            fi
            echo "Deleted $tag"
          done
