# Builds and tests stable tags, publishes to GHCR and Docker Hub, updates release notes idempotently and prunes old images/releases.
# Called by ci-tag.yml; push tags and validated manual dispatches support automatic releases and historical backfills.
# The release-tag job queue serializes publication, release mutation, latest alias changes and retention pruning.
name: CI Release
on:
  push:
    tags: ["v**"]
  workflow_call:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      DOCKERHUB_PUSH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable vX.Y.Z tag to release or backfill
        required: true
        type: string
permissions: {}
env:
  KEEP_RELEASES: "2"
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Validate tag and resolve its commit
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$TAG" =~ $semver ]] || { echo "::error::Expected an existing strict stable vX.Y.Z tag" >&2; exit 1; }
          ref=$(gh api "repos/$REPO/git/ref/tags/$TAG")
          kind=$(jq -r '.object.type' <<< "$ref")
          commit=$(jq -r '.object.sha' <<< "$ref")
          while [ "$kind" = tag ]; do
            ref=$(gh api "repos/$REPO/git/tags/$commit")
            kind=$(jq -r '.object.type' <<< "$ref")
            commit=$(jq -r '.object.sha' <<< "$ref")
          done
          [[ "$kind" == commit && "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Tag does not resolve to a commit" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout selected tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Verify selected commit
        env:
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build and test
        run: ./gradlew build
      - name: Package jar and health-check class
        run: |
          set -euo pipefail
          jar_count=$(find build/libs -maxdepth 1 -type f -name 'rcas-*.jar' | wc -l | tr -d '[:space:]')
          [ "$jar_count" -eq 1 ] && [ -f build/healthcheck/HealthCheck.class ] || { echo "::error::Expected exactly one boot jar and HealthCheck.class" >&2; exit 1; }
          jar=$(find build/libs -maxdepth 1 -type f -name 'rcas-*.jar' -print -quit)
          tar -czf release-image-context.tar.gz "$jar" build/healthcheck/HealthCheck.class
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-context
          path: release-image-context.tar.gz
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-tag
      queue: max
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - name: Verify checkout matches tag commit
        env:
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-image-context
          path: ${{ runner.temp }}/release-image-context
      - name: Restore jar and health-check class
        run: tar -xzf "$RUNNER_TEMP/release-image-context/release-image-context.tar.gz"
      - name: Log in to Docker Hardened Images registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build or verify release image
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          image="ghcr.io/$REPO:$TAG"
          versions="$RUNNER_TEMP/package-versions.json"
          if gh api --paginate --slurp "user/packages/container/rcas/versions?per_page=100" > "$versions" 2>"$RUNNER_TEMP/package-error"; then
            ids=$(jq -r --arg tag "$TAG" 'add | .[] | select(any(.metadata.container.tags[]?; . == $tag)) | .id' "$versions")
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/package-error"; then
            if docker pull "$image" 2>"$RUNNER_TEMP/existing-image-error"; then ids="registry-image"
            elif grep -Eiq 'manifest unknown|manifest not found' "$RUNNER_TEMP/existing-image-error"; then ids=""
            else cat "$RUNNER_TEMP/existing-image-error" >&2; echo "::error::Cannot verify whether $image already exists; refusing to overwrite" >&2; exit 1; fi
          else cat "$RUNNER_TEMP/package-error" >&2; echo "::error::Cannot inspect GHCR versions; refusing an unsafe overwrite" >&2; exit 1; fi
          verify_image_labels() {
            actual_source=$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')
            actual_version=$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
            actual_revision=$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            if [ "$actual_source" != "https://github.com/$REPO" ] || [ "$actual_version" != "$TAG" ] || [ "$actual_revision" != "$COMMIT" ]; then
              echo "::error::Image OCI labels do not match source, tag and resolved commit" >&2
              return 1
            fi
          }
          if [ -n "$ids" ]; then
            docker pull "$image"
            verify_image_labels
          else
            jar_count=$(find build/libs -maxdepth 1 -type f -name 'rcas-*.jar' | wc -l | tr -d '[:space:]')
            [ "$jar_count" -eq 1 ] && [ -f build/healthcheck/HealthCheck.class ] || { echo "::error::Build artifacts are incomplete" >&2; exit 1; }
            # CLI labels also cover historical tags whose Dockerfile predates OCI ARG/LABEL support.
            docker build \
              --build-arg "OCI_SOURCE=https://github.com/$REPO" \
              --build-arg "OCI_VERSION=$TAG" \
              --build-arg "OCI_REVISION=$COMMIT" \
              --label "org.opencontainers.image.source=https://github.com/$REPO" \
              --label "org.opencontainers.image.version=$TAG" \
              --label "org.opencontainers.image.revision=$COMMIT" \
              --tag "$image" .
            verify_image_labels
            docker push "$image"
          fi
          digest=$(docker image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}' | awk -F@ -v image="ghcr.io/$REPO" '$1 == image { print $2; exit }')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Unable to verify image digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io
      - name: Log out of Docker Hardened Images registry
        if: always()
        run: docker logout dhi.io
      - name: Verify no registry credentials remain
        if: always()
        run: |
          config="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          if [ -f "$config" ] && jq -e '(.auths // {}) + (.credHelpers // {}) | has("ghcr.io") or has("dhi.io")' "$config" >/dev/null; then echo "::error::Registry credentials remain in $config" >&2; exit 1; fi
  dockerhub:
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-tag
      queue: max
    permissions:
      contents: read
      packages: read
    steps:
      - name: Require Docker Hub push credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PUSH_TOKEN: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_PUSH_TOKEN" ]; then
            echo "::error::Docker Hub publishing requires DOCKERHUB_USERNAME and DOCKERHUB_PUSH_TOKEN (a Read, Write & Delete Docker Hub PAT). Add the repository secret and rerun the release." >&2
            exit 1
          fi
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PUSH_TOKEN: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
        run: |
          if ! printf '%s' "$DOCKERHUB_PUSH_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin 2>"$RUNNER_TEMP/dockerhub-login-error"; then
            cat "$RUNNER_TEMP/dockerhub-login-error" >&2
            echo "::error::Docker Hub login was denied. DOCKERHUB_PUSH_TOKEN must be a Docker Hub PAT with Read and Write access (and Delete for retention pruning)." >&2
            exit 1
          fi
      - name: Require skopeo
        run: |
          command -v skopeo >/dev/null || { echo "::error::skopeo is required for the digest-preserving Docker Hub copy but is not installed on this runner" >&2; exit 1; }
      - name: Copy or verify Docker Hub release image
        env:
          REPO: ${{ github.repository }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ needs.resolve.outputs.tag }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          image="docker.io/$DOCKERHUB_USERNAME/rcas:$TAG"
          source="ghcr.io/$REPO@$DIGEST"
          manifest="$RUNNER_TEMP/dockerhub-manifest"
          # Top-level digest of the exact manifest bytes (single manifest or list); written to a file so no byte is stripped.
          inspect_digest() {
            skopeo inspect --raw "docker://$1" >"$manifest" 2>"$RUNNER_TEMP/dockerhub-inspect-error" || return 1
            [ -s "$manifest" ] || return 1
            shasum -a 256 "$manifest" | awk '{print "sha256:" $1}'
          }
          copy_exact() {
            if ! skopeo copy --all --preserve-digests "docker://$source" "docker://$image" 2>"$RUNNER_TEMP/dockerhub-push-error"; then
              cat "$RUNNER_TEMP/dockerhub-push-error" >&2
              if grep -Eiq '401|403|denied|insufficient_scope|unauthorized' "$RUNNER_TEMP/dockerhub-push-error"; then
                echo "::error::Docker Hub denied image publication; DOCKERHUB_PUSH_TOKEN must have Read and Write scope (and Delete for retention pruning)." >&2
              fi
              exit 1
            fi
            actual=$(inspect_digest "$image") || { cat "$RUNNER_TEMP/dockerhub-inspect-error" >&2; echo "::error::Unable to verify the Docker Hub image digest after copying" >&2; exit 1; }
            [ "$actual" = "$DIGEST" ] || { echo "::error::Docker Hub digest mismatch for $image: expected $DIGEST, found $actual" >&2; exit 1; }
          }
          if actual=$(inspect_digest "$image"); then
            if [ "$actual" = "$DIGEST" ]; then
              echo "$image already points to $DIGEST; leaving it unchanged"
            elif jq -e --arg digest "$DIGEST" '(.mediaType == "application/vnd.docker.distribution.manifest.list.v2+json" or .mediaType == "application/vnd.oci.image.index.v1+json") and (.manifests | length == 1) and .manifests[0].digest == $digest' "$manifest" >/dev/null 2>&1; then
              echo "$image is a single-child manifest list wrapping $DIGEST; replacing it with an exact copy"
              copy_exact
            else
              echo "::error::Refusing to overwrite $image: it points to $actual, expected $DIGEST" >&2
              exit 1
            fi
          else
            if ! grep -Eiq 'manifest unknown|manifest not found|not found' "$RUNNER_TEMP/dockerhub-inspect-error"; then
              cat "$RUNNER_TEMP/dockerhub-inspect-error" >&2
              echo "::error::Cannot verify $image on Docker Hub; refusing an unsafe overwrite" >&2
              exit 1
            fi
            copy_exact
          fi
      - name: Log out of Docker Hub
        if: always()
        run: |
          docker logout docker.io || true
          docker logout https://index.docker.io/v1/ || true
          docker logout || true
      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io
      - name: Verify no registry credentials remain
        if: always()
        run: |
          config="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          if [ -f "$config" ] && jq -e '(.auths // {}) + (.credHelpers // {}) | has("ghcr.io") or has("docker.io") or has("https://index.docker.io/v1/")' "$config" >/dev/null; then echo "::error::Registry credentials remain in $config" >&2; exit 1; fi
  release:
    needs: [resolve, build, publish, dockerhub]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-tag
      queue: max
    permissions:
      contents: write
    steps:
      - name: Download release jar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-image-context
          path: ${{ runner.temp }}/release-image-context
      - name: Restore release jar
        run: tar -xzf "$RUNNER_TEMP/release-image-context/release-image-context.tar.gz"
      - name: Create or update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.resolve.outputs.tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DOCKERHUB_USERNAME" ] || { echo "::error::DOCKERHUB_USERNAME is required to reference the Docker Hub image" >&2; exit 1; }
          HUB_IMAGE="docker.io/$DOCKERHUB_USERNAME/rcas:$TAG"
          HUB_URL="https://hub.docker.com/r/$DOCKERHUB_USERNAME/rcas"
          notes="$RUNNER_TEMP/release-notes.md"
          if release=$(gh api "repos/$REPO/releases/tags/$TAG" 2>"$RUNNER_TEMP/release-error"); then
            release_id=$(jq -r '.id' <<< "$release")
            jq -r '.body // ""' <<< "$release" > "$notes"
            python3 - "$notes" "$IMAGE" "$HUB_IMAGE" "$DIGEST" "$REPO" "$HUB_URL" <<'PY'
          import pathlib, re, sys, textwrap
          path = pathlib.Path(sys.argv[1])
          body = path.read_text(encoding="utf-8")
          body = re.sub(r"(?s)<!-- rcas-docker-image:start -->.*?<!-- rcas-docker-image:end -->\s*", "", body)
          body = body.split("<!-- rcas-image-reference -->", 1)[0].rstrip()
          section = textwrap.dedent(f"""<!-- rcas-docker-image:start -->
          ## Docker image

          ```bash
          docker pull {sys.argv[2]}
          docker pull {sys.argv[3]}
          ```

          Digest: `{sys.argv[4]}`

          [GitHub Container Registry](https://github.com/{sys.argv[5]}/pkgs/container/rcas) · [Docker Hub]({sys.argv[6]})
          <!-- rcas-docker-image:end -->""").strip()
          path.write_text(f"{section}\n\n{body}\n" if body else f"{section}\n", encoding="utf-8")
          PY
            gh api -X PATCH "repos/$REPO/releases/$release_id" -F "body=@$notes" >/dev/null
          else
            grep -q 'HTTP 404' "$RUNNER_TEMP/release-error" || { cat "$RUNNER_TEMP/release-error" >&2; exit 1; }
            gh api -X POST "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body > "$notes"
            python3 - "$notes" "$IMAGE" "$HUB_IMAGE" "$DIGEST" "$REPO" "$HUB_URL" <<'PY'
          import pathlib, sys, textwrap
          path = pathlib.Path(sys.argv[1])
          body = path.read_text(encoding="utf-8").rstrip()
          section = textwrap.dedent(f"""<!-- rcas-docker-image:start -->
          ## Docker image

          ```bash
          docker pull {sys.argv[2]}
          docker pull {sys.argv[3]}
          ```

          Digest: `{sys.argv[4]}`

          [GitHub Container Registry](https://github.com/{sys.argv[5]}/pkgs/container/rcas) · [Docker Hub]({sys.argv[6]})
          <!-- rcas-docker-image:end -->""").strip()
          path.write_text(f"{section}\n\n{body}\n" if body else f"{section}\n", encoding="utf-8")
          PY
            gh release create "$TAG" build/libs/*.jar -R "$REPO" --title "$TAG" --notes-file "$notes" --verify-tag
          fi
  latest:
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-tag
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point latest at the highest stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          latest_tag=$(gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ { print }' | sort -V | tail -n 1)
          [ -n "$latest_tag" ] || { echo "::error::No stable release is available" >&2; exit 1; }
          docker pull "$IMAGE:$latest_tag"
          docker tag "$IMAGE:$latest_tag" "$IMAGE:latest"
          docker push "$IMAGE:latest"
      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io
      - name: Verify no GHCR credentials remain
        if: always()
        run: |
          config="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          if [ -f "$config" ] && jq -e '(.auths // {}) + (.credHelpers // {}) | has("ghcr.io")' "$config" >/dev/null; then echo "::error::GHCR credentials remain in $config" >&2; exit 1; fi
  dockerhub-latest:
    needs: [resolve, latest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-tag
      queue: max
    permissions:
      contents: read
      packages: read
    steps:
      - name: Require Docker Hub push credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PUSH_TOKEN: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_PUSH_TOKEN" ]; then
            echo "::error::Docker Hub latest publishing requires DOCKERHUB_USERNAME and DOCKERHUB_PUSH_TOKEN (a Read, Write & Delete Docker Hub PAT). Add the repository secret and rerun the release." >&2
            exit 1
          fi
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PUSH_TOKEN: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
        run: |
          if ! printf '%s' "$DOCKERHUB_PUSH_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin 2>"$RUNNER_TEMP/dockerhub-login-error"; then
            cat "$RUNNER_TEMP/dockerhub-login-error" >&2
            echo "::error::Docker Hub login was denied. DOCKERHUB_PUSH_TOKEN must be a Docker Hub PAT with Read and Write access (and Delete for retention pruning)." >&2
            exit 1
          fi
      - name: Require skopeo
        run: |
          command -v skopeo >/dev/null || { echo "::error::skopeo is required for the digest-preserving Docker Hub copy but is not installed on this runner" >&2; exit 1; }
      - name: Point Docker Hub latest at the highest stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          latest_tag=$(gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ { print }' | sort -V | tail -n 1)
          [ -n "$latest_tag" ] || { echo "::error::No stable release is available" >&2; exit 1; }
          if [ "$latest_tag" != "$TAG" ]; then
            echo "Docker Hub latest untouched: $TAG is not the highest stable release ($latest_tag)"
            exit 0
          fi
          manifest="$RUNNER_TEMP/dockerhub-latest-manifest"
          inspect_digest() {
            skopeo inspect --raw "docker://$1" >"$manifest" || return 1
            [ -s "$manifest" ] || return 1
            shasum -a 256 "$manifest" | awk '{print "sha256:" $1}'
          }
          digest=$(inspect_digest "ghcr.io/$REPO:$latest_tag") || { echo "::error::Unable to inspect the GHCR $latest_tag image" >&2; exit 1; }
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Unable to verify the GHCR latest image digest" >&2; exit 1; }
          image="docker.io/$DOCKERHUB_USERNAME/rcas:latest"
          if ! skopeo copy --all --preserve-digests "docker://ghcr.io/$REPO@$digest" "docker://$image" 2>"$RUNNER_TEMP/dockerhub-latest-error"; then
            cat "$RUNNER_TEMP/dockerhub-latest-error" >&2
            if grep -Eiq '401|403|denied|insufficient_scope|unauthorized' "$RUNNER_TEMP/dockerhub-latest-error"; then echo "::error::Docker Hub denied latest publication; DOCKERHUB_PUSH_TOKEN must have Read and Write scope (and Delete for retention pruning)." >&2; fi
            exit 1
          fi
          actual=$(inspect_digest "$image") || { echo "::error::Unable to verify the Docker Hub latest digest after copying" >&2; exit 1; }
          [ "$actual" = "$digest" ] || { echo "::error::Docker Hub latest digest mismatch: expected $digest, found $actual" >&2; exit 1; }
      - name: Log out of Docker Hub
        if: always()
        run: |
          docker logout docker.io || true
          docker logout https://index.docker.io/v1/ || true
          docker logout || true
      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io
      - name: Verify no registry credentials remain
        if: always()
        run: |
          config="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          if [ -f "$config" ] && jq -e '(.auths // {}) + (.credHelpers // {}) | has("ghcr.io") or has("docker.io") or has("https://index.docker.io/v1/")' "$config" >/dev/null; then echo "::error::Registry credentials remain in $config" >&2; exit 1; fi
  prune:
    needs: [dockerhub-latest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-tag
      queue: max
    permissions:
      contents: write
      packages: write
    steps:
      - name: Prune stale images before releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEEP_RELEASES: ${{ env.KEEP_RELEASES }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PUSH_TOKEN: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_PUSH_TOKEN" ]; then
            echo "::error::Docker Hub retention requires DOCKERHUB_USERNAME and DOCKERHUB_PUSH_TOKEN (a Read, Write & Delete Docker Hub PAT). Add the repository secret and rerun the release." >&2
            exit 1
          fi
          release_rows=$(gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[] | [.tag_name, (.id | tostring)] | @tsv')
          all_tags=$(gh api "repos/$REPO/git/matching-refs/tags/v" --paginate --jq '.[].ref | sub("^refs/tags/"; "")' | awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ { print }' | sort -V -r)
          retained=$(printf '%s\n' "$all_tags" | head -n "$KEEP_RELEASES")
          stale=$(printf '%s\n' "$all_tags" | tail -n +$((KEEP_RELEASES + 1)))
          [ -n "$stale" ] || exit 0
          hub_token=$(jq -n '{username:env.DOCKERHUB_USERNAME,password:env.DOCKERHUB_PUSH_TOKEN}' \
            | curl --silent --show-error --fail-with-body -X POST https://hub.docker.com/v2/users/login/ \
                -H 'Content-Type: application/json' --data-binary @- \
            | jq -er '.token') || { echo "::error::Docker Hub API login failed; verify DOCKERHUB_PUSH_TOKEN Read, Write & Delete access." >&2; exit 1; }
          echo "::add-mask::$hub_token"
          auth_header_file=$(mktemp "$RUNNER_TEMP/dockerhub-auth-header.XXXXXX")
          chmod 600 "$auth_header_file"
          trap 'rm -f "$auth_header_file"' EXIT
          printf 'Authorization: JWT %s\n' "$hub_token" > "$auth_header_file"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            code=$(curl --silent --show-error -o "$RUNNER_TEMP/dockerhub-delete-response" -w '%{http_code}' \
              -X DELETE "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/rcas/tags/$tag" \
              -H "@$auth_header_file") || { echo "::error::Docker Hub tag deletion request failed for $tag; retaining all releases and tags." >&2; exit 1; }
            case "$code" in
              204|404) echo "Deleted or already absent Docker Hub tag $tag" ;;
              *) echo "::error::Docker Hub refused deletion of stale tag $tag (HTTP $code); DOCKERHUB_PUSH_TOKEN needs Read, Write & Delete scope. Retaining releases and tags." >&2; exit 1 ;;
            esac
          done <<< "$stale"
          versions="$RUNNER_TEMP/package-versions.json"
          if ! gh api --paginate --slurp "user/packages/container/rcas/versions?per_page=100" > "$versions" 2>"$RUNNER_TEMP/package-error"; then
            cat "$RUNNER_TEMP/package-error" >&2
            echo "::error::Cannot inspect GHCR package versions; retaining all releases and tags" >&2
            exit 1
          fi
          stale_json=$(printf '%s\n' "$stale" | jq -R . | jq -s .)
          if [ -n "$versions" ]; then
            ids=$(jq -r --argjson stale "$stale_json" 'add | .[] as $version | ($version.metadata.container.tags // []) as $tags | select(any($tags[]?; . as $tag | $stale | index($tag))) | select(all($tags[]?; . as $tag | ($stale | index($tag)) != null)) | $version.id' "$versions" | sort -u)
            for id in $ids; do
              tags=$(jq -r --arg id "$id" 'add | .[] | select((.id | tostring) == $id) | .metadata.container.tags[]?' "$versions" | paste -sd, -)
              if ! gh api -X DELETE "user/packages/container/rcas/versions/$id"; then echo "::error::GHCR deletion denied for stale version $id (tags: $tags); release/tag metadata is retained. Ask the package owner to grant package-version deletion access, then rerun." >&2; exit 1; fi
            done
          fi
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            if printf '%s\n' "$retained" | grep -Fxq "$tag"; then continue; fi
            id=$(awk -F '\t' -v tag="$tag" '$1 == tag { print $2; exit }' <<< "$release_rows")
            [ -z "$id" ] || gh api -X DELETE "repos/$REPO/releases/$id"
            gh api -X DELETE "repos/$REPO/git/refs/tags/$tag"
            echo "Deleted stale release/tag $tag after image deletion"
          done <<< "$all_tags"
