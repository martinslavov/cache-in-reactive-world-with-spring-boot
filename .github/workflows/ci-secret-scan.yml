# Scans the full git history for committed secrets with gitleaks (allowlist: .gitleaks.toml).
# Runs on every pull request (no path filters) so the required check is always reported.
name: CI Secret Scan

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks

      - name: Scan history
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose .
