# Automatic static code review: runs Checkstyle (.github/checkstyle/checkstyle.xml, derived from
# .github/code-review-guidelines.md) on every pull request. Violations fail the check.
name: CI Static Review

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-static-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-review:
    name: Static Review (checkstyle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Execute static review (checkstyle)
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Upload checkstyle reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkstyle-reports
          path: build/reports/checkstyle/
          if-no-files-found: ignore
