plugins {
	id 'java'
	id 'checkstyle'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.reactive'
version = '0.0.1-SNAPSHOT'
java {
	sourceCompatibility = JavaVersion.VERSION_25
}

repositories {
	mavenCentral()
}

ext {
	springdocOpenPIWebFluxVersion = '3.2.0'
	otelLog4jAppenderVersion = '2.28.0-alpha'
}

configurations {
	all {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	}
}

dependencies {
	implementation "org.springframework.boot:spring-boot-starter-webflux"
	implementation "org.springframework.boot:spring-boot-starter-data-r2dbc"
	implementation "org.springframework.boot:spring-boot-starter-log4j2"
	implementation "org.springframework.boot:spring-boot-starter-actuator"
	implementation "org.springframework.boot:spring-boot-starter-cache"
	implementation "org.springframework.boot:spring-boot-starter-data-redis-reactive"
	implementation "com.github.ben-manes.caffeine:caffeine"
	implementation "tools.jackson.dataformat:jackson-dataformat-yaml"
	implementation "io.projectreactor.addons:reactor-extra"
	implementation "org.springdoc:springdoc-openapi-starter-webflux-api:${springdocOpenPIWebFluxVersion}"
	implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:${springdocOpenPIWebFluxVersion}"
	implementation "org.springframework.boot:spring-boot-starter-opentelemetry"
	implementation "io.opentelemetry.instrumentation:opentelemetry-log4j-appender-2.17:${otelLog4jAppenderVersion}"
	runtimeOnly "io.micrometer:micrometer-registry-prometheus"
	runtimeOnly "org.postgresql:r2dbc-postgresql"
	runtimeOnly "org.postgresql:postgresql"

	// Test
	testImplementation "org.springframework.boot:spring-boot-starter-test"
	testImplementation "io.projectreactor:reactor-test"
	testImplementation "org.springframework.boot:spring-boot-starter-webflux-test"
	testImplementation "org.testcontainers:testcontainers"
	testImplementation "org.testcontainers:testcontainers-r2dbc"
	testImplementation "org.testcontainers:testcontainers-postgresql"

}

// Only the executable boot jar is produced (Dockerfile and release rely on a single jar)
jar {
	enabled = false
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

// 0.8.13+ is needed to read Java 25 class files
jacoco {
	toolVersion = '0.8.14'
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
}

// Coverage gate (part of `check`, so of the required unit-tests job): minimums are the measured coverage
// rounded down to the nearest 5 % (measured: LINE 49.28 %, BRANCH 16.67 %, so 45 % and 15 %); they only prevent regressions.
tasks.named('jacocoTestCoverageVerification') {
	dependsOn tasks.named('test')
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.45
			}
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.15
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}

// Static code review rules (.github/checkstyle/checkstyle.xml); run in CI by the CI Static Review workflow
checkstyle {
	toolVersion = '11.0.0'
	configDirectory = file('.github/checkstyle')
	configFile = file('.github/checkstyle/checkstyle.xml')
	maxWarnings = 0
}

tasks.withType(JavaCompile) {
	options.compilerArgs << '-Xlint:-deprecation'
}
