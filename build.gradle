plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.reactive'
version = '0.0.1-SNAPSHOT'
java {
	sourceCompatibility = JavaVersion.VERSION_25
}

repositories {
	mavenCentral()
}

ext {
	springdocOpenPIWebFluxVersion = '3.2.0'
}

configurations {
	all {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	}
}

dependencies {
	implementation "org.springframework.boot:spring-boot-starter-webflux"
	implementation "org.springframework.boot:spring-boot-starter-data-r2dbc"
	implementation "org.springframework.boot:spring-boot-starter-log4j2"
	implementation "org.springframework.boot:spring-boot-starter-actuator"
	implementation "org.springframework.boot:spring-boot-starter-cache"
	implementation "org.springframework.boot:spring-boot-starter-data-redis-reactive"
	implementation "com.github.ben-manes.caffeine:caffeine"
	implementation "tools.jackson.dataformat:jackson-dataformat-yaml"
	implementation "io.projectreactor.addons:reactor-extra"
	implementation "org.springdoc:springdoc-openapi-starter-webflux-api:${springdocOpenPIWebFluxVersion}"
	implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:${springdocOpenPIWebFluxVersion}"
	runtimeOnly "io.micrometer:micrometer-registry-prometheus"
	runtimeOnly "org.postgresql:r2dbc-postgresql"
	runtimeOnly "org.postgresql:postgresql"

	// Test
	testImplementation "org.springframework.boot:spring-boot-starter-test"
	testImplementation "io.projectreactor:reactor-test"
	testImplementation "org.springframework.boot:spring-boot-starter-webflux-test"
	testImplementation "org.testcontainers:testcontainers"
	testImplementation "org.testcontainers:testcontainers-r2dbc"
	testImplementation "org.testcontainers:testcontainers-postgresql"

}

// Only the executable boot jar is produced (Dockerfile and release rely on a single jar)
jar {
	enabled = false
}

tasks.named('test') {
	useJUnitPlatform()
}

// Component tests run against the whole stack started with docker compose (see Makefile).
// They are not part of `build`; run them with `./gradlew componentTest`.
sourceSets {
	componentTest {
		java.srcDir 'src/componentTest/java'
		compileClasspath += sourceSets.main.output + sourceSets.test.runtimeClasspath
		runtimeClasspath += output + compileClasspath
	}
}

tasks.register('componentTest', Test) {
	description = 'Runs component tests against the running docker compose stack.'
	group = 'verification'
	testClassesDirs = sourceSets.componentTest.output.classesDirs
	classpath = sourceSets.componentTest.runtimeClasspath
	useJUnitPlatform()
	testLogging {
		events 'passed', 'failed', 'skipped'
		showStandardStreams = false
	}
	outputs.upToDateWhen { false }
}

tasks.withType(JavaCompile) {
	options.compilerArgs << '-Xlint:-deprecation'
}
