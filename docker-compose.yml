name: rcas
services:
  # ------------------------------
  # PostgreSQL
  # ------------------------------
  postgres:
    image: postgres:15.2
    container_name: rcas-postgres
    networks:
      - rcas-docker-network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    volumes:
      # Executed in alphabetical order on first start: schema, then seed data
      - ./db.migration/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db.migration/V2__InsertUser.sql:/docker-entrypoint-initdb.d/02-insert-user.sql:ro
      - ./db.migration/V3__InsertSubscription.sql:/docker-entrypoint-initdb.d/03-insert-subscription.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ------------------------------
  # Redis
  # ------------------------------
  redis:
    image: redis:7
    container_name: rcas-redis
    networks:
      - rcas-docker-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ------------------------------
  # Cache service (requires: gradle bootJar)
  # Started only with: docker compose --profile app up
  # ------------------------------
  rcas:
    profiles: ["app"]
    container_name: rcas
    networks:
      - rcas-docker-network
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      JDK_JAVA_OPTIONS: "-XX:MaxRAMPercentage=75"
      SPRING_PROFILES_ACTIVE: "dev"
      SPRING_R2DBC_URL: "r2dbc:postgresql://postgres:5432/testdb"
      SPRING_R2DBC_USERNAME: "test"
      SPRING_R2DBC_PASSWORD: "test"
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: "6379"
      # OTLP export is off by default; `make monitoring-up` enables it (docker/monitoring/monitoring.env)
      LOGGING_CONFIG: "${RCAS_LOGGING_CONFIG:-classpath:log4j2.yaml}"
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: "${RCAS_OTLP_TRACING_ENABLED:-false}"
      MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED: "${RCAS_OTLP_LOGGING_ENABLED:-false}"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "${RCAS_TRACING_SAMPLING:-0.1}"
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: "http://otel-collector:4318/v1/logs"
      OTEL_SERVICE_NAME: "rcas"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Command, interval, timeout and retries come from the image HEALTHCHECK (Dockerfile).
    # Only the probe frequency during the start period is raised so `make up --wait` does not wait 30 s;
    # Compose requires start_period with start_interval, so it repeats the Dockerfile value.
    healthcheck:
      start_period: 40s
      start_interval: 2s

  # ------------------------------
  # Monitoring (profile: monitoring): OpenTelemetry Collector, Prometheus, Loki, Grafana
  # Started with: make monitoring-up
  # ------------------------------
  otel-collector:
    profiles: ["monitoring"]
    image: otel/opentelemetry-collector:0.116.1
    container_name: rcas-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    networks:
      - rcas-docker-network
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./docker/monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - loki

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.0.1
    container_name: rcas-prometheus
    networks:
      - rcas-docker-network
    ports:
      - "9090:9090"
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    profiles: ["monitoring"]
    image: grafana/loki:3.3.2
    container_name: rcas-loki
    networks:
      - rcas-docker-network
    ports:
      - "3100:3100"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.4.0
    container_name: rcas-grafana
    networks:
      - rcas-docker-network
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

networks:
  rcas-docker-network:
    name: rcas-docker-network
